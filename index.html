<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://use.typekit.net/nmy3epc.css"
    media="print"
    onload="this.media='all'"
  />
  <noscript><link rel="stylesheet" href="https://use.typekit.net/nmy3epc.css" /></noscript>
    <meta
      name="description"
      content="Faith-driven financial services for churches, ministries, and individuals."
    />
    <title>AGFinancial React Rebuild</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#ffffff;color:#414042;font:600 16px/1.4 Arial,sans-serif;">
        Loading AGFinancial...
      </div>
    </div>
    <script>
      (() => {
        const RECOVERY_STATE_KEY = 'agf:module-load-recovery';
        const RECOVERY_WINDOW_MS = 30000;
        const BOOT_TIMEOUT_MS = 20000;

        const readRecoveryState = () => {
          try {
            return JSON.parse(window.sessionStorage.getItem(RECOVERY_STATE_KEY) || 'null');
          } catch {
            return null;
          }
        };

        const writeRecoveryState = (value) => {
          try {
            window.sessionStorage.setItem(RECOVERY_STATE_KEY, JSON.stringify(value));
          } catch {
            // Ignore storage failures during bootstrap.
          }
        };

        const clearRecoveryState = () => {
          try {
            window.sessionStorage.removeItem(RECOVERY_STATE_KEY);
          } catch {
            // Ignore storage failures during bootstrap.
          }
        };

        const canAttemptRecoveryReload = () => {
          const state = readRecoveryState();
          if (!state || !Number.isFinite(Number(state.ts))) {
            return true;
          }
          return (Date.now() - Number(state.ts)) > RECOVERY_WINDOW_MS;
        };

        const showRecoveryMessage = (message) => {
          const root = document.getElementById('root') || document.body;
          if (!root || document.getElementById('agf-module-recovery-banner')) {
            return;
          }
          const banner = document.createElement('div');
          banner.id = 'agf-module-recovery-banner';
          banner.style.cssText = [
            'margin: 2rem auto',
            'max-width: 42rem',
            'padding: 1rem 1.25rem',
            'border: 1px solid rgba(0,0,0,0.12)',
            'border-radius: 0.75rem',
            'background: #ffffff',
            'color: #1f2937',
            'font: 600 16px/1.45 Arial, sans-serif',
            'box-shadow: 0 10px 30px rgba(0,0,0,0.08)',
          ].join(';');
          banner.textContent = message;
          root.prepend(banner);
        };

        const isRecoverableModuleLoadFailure = (value) => (
          /Outdated Optimize Dep|Failed to fetch dynamically imported module|error loading dynamically imported module|ChunkLoadError|Importing a module script failed|Failed to fetch module/i.test(String(value || ''))
        );

        const requestRecoveryReload = (reason) => {
          if (!canAttemptRecoveryReload()) {
            showRecoveryMessage('A stale dev module prevented the page from loading. Refresh once or restart the Vite dev server.');
            return;
          }
          writeRecoveryState({
            reason,
            ts: Date.now(),
            path: `${window.location.pathname}${window.location.search}${window.location.hash}`,
          });
          showRecoveryMessage('Refreshing after a stale module response from the dev server...');
          window.location.reload();
        };

        window.addEventListener('error', (event) => {
          const combinedMessage = [
            event?.message,
            event?.filename,
            event?.error?.message,
          ].filter(Boolean).join(' ');

          if (!isRecoverableModuleLoadFailure(combinedMessage)) {
            return;
          }

          event.preventDefault?.();
          requestRecoveryReload('error');
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          const reason = event?.reason;
          const combinedMessage = typeof reason === 'string'
            ? reason
            : [
              reason?.message,
              reason?.stack,
            ].filter(Boolean).join(' ');

          if (!isRecoverableModuleLoadFailure(combinedMessage)) {
            return;
          }

          event.preventDefault?.();
          requestRecoveryReload('unhandledrejection');
        });

        window.addEventListener('pageshow', (event) => {
          const navigationEntries = typeof window.performance?.getEntriesByType === 'function'
            ? window.performance.getEntriesByType('navigation')
            : [];
          const navigationType = navigationEntries[0] && navigationEntries[0].type;
          const isLikelyViteDevServer = window.location.port === '5173';

          if (!isLikelyViteDevServer) {
            return;
          }

          if (event.persisted || navigationType === 'back_forward') {
            requestRecoveryReload('pageshow');
          }
        });

        window.addEventListener('load', () => {
          if (window.__AGF_APP_BOOTED__) {
            clearRecoveryState();
          }
        }, { once: true });

        window.setTimeout(() => {
          if (window.__AGF_APP_BOOTED__) {
            return;
          }
          requestRecoveryReload('bootstrap-timeout');
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
